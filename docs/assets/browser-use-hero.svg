  <text x="1040" y="155" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#06101F">1</text>

  <text x="672" y="188" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#93A4BF">Password</text>
  <rect x="672" y="196" width="340" height="36" rx="8" fill="#0B1426" stroke="#2A3B5C"/>
  <text x="686" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#C7D3E6">••••••••••</text>
  <circle cx="1040" cy="214" r="13" fill="#5B8DEF"/>
  <text x="1040" y="219" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#06101F">2</text>

  <rect x="672" y="246" width="340" height="36" rx="8" fill="#2563EB"/>
  <text x="842" y="269" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Create account</text>
  <circle cx="1040" cy="264" r="13" fill="#5B8DEF"/>
  <text x="1040" y="269" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#06101F">3</text>

  <rect x="640" y="314" width="496" height="78" rx="12" fill="#0E1628" stroke="#22304A"/>
  <rect x="640" y="314" width="4" height="78" rx="2" fill="#5B8DEF"/>
  <text x="660" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9FB0CC">1 textbox &quot;Email&quot;</text>
  <text x="660" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9FB0CC">2 textbox &quot;Password&quot;</text>
  <text x="660" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#34D399">3 button &quot;Create account&quot;</text>
</svg>
