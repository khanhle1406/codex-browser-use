<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Browser Use: an indexed accessibility tree beside a Chrome form, with numbered elements 1, 2 and 3">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1730"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="0.82" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#5B8DEF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5B8DEF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121C31"/>
      <stop offset="1" stop-color="#0D1526"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#hero-bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#hero-glow)"/>

  <text x="64" y="92" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3.2" fill="#7FA6FF">BROWSER USE</text>
  <text x="64" y="156" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F2F6FF">A real browser</text>
  <text x="64" y="206" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F2F6FF">for any coding agent</text>
  <text x="64" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#9FB0CC">Read the page as an indexed accessibility tree.</text>
  <text x="64" y="276" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#9FB0CC">Act by number. Re-read. No Playwright, no engine.</text>

  <rect x="64" y="312" width="92" height="34" rx="17" fill="#13203A" stroke="#2A3B5C"/>
  <circle cx="84" cy="329" r="4" fill="#5B8DEF"/>
  <text x="98" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9FB0CC">AX tree</text>

  <rect x="166" y="312" width="62" height="34" rx="17" fill="#13203A" stroke="#2A3B5C"/>
  <circle cx="184" cy="329" r="4" fill="#34D399"/>
  <text x="198" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9FB0CC">CDP</text>

  <rect x="238" y="312" width="104" height="34" rx="17" fill="#13203A" stroke="#2A3B5C"/>
  <circle cx="256" cy="329" r="4" fill="#A78BFA"/>
  <text x="270" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9FB0CC">MCP stdio</text>

  <rect x="352" y="312" width="100" height="34" rx="17" fill="#13203A" stroke="#2A3B5C"/>
  <circle cx="370" cy="329" r="4" fill="#FBBF24"/>
  <text x="384" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9FB0CC">local only</text>

  <rect x="640" y="48" width="496" height="250" rx="16" fill="url(#hero-card)" stroke="#22304A"/>
  <circle cx="664" cy="73" r="5" fill="#F87171"/>
  <circle cx="684" cy="73" r="5" fill="#FBBF24"/>
  <circle cx="704" cy="73" r="5" fill="#34D399"/>
  <rect x="722" y="61" width="290" height="22" rx="11" fill="#0B1426" stroke="#22304A"/>
  <text x="736" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#93A4BF">localhost:3000</text>

  <text x="672" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#93A4BF">Email</text>
  <rect x="672" y="132" width="340" height="36" rx="8" fill="#0B1426" stroke="#2A3B5C"/>
  <text x="686" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#C7D3E6">ada@example.com</text>
